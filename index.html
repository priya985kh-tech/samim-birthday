<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Samim's Birthday Surprise 🎁</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="small-text">
            ✨ A Little Surprise For You ✨
        </div>

        <h1>
            Samim, I Have Something For You...
        </h1>

        <p class="instruction">
            Click the gift box to open your surprise 🎁
        </p>


        <!-- GIFT BOX -->

        <div class="gift" onclick="openGift()">

            <!-- Bow -->
            <div class="bow bow-left"></div>
            <div class="bow bow-right"></div>
            <div class="bow-center"></div>

            <!-- Lid -->
            <div class="lid">
                <div class="lid-ribbon"></div>
            </div>

            <!-- Box -->
            <div class="box">
                <div class="vertical-ribbon"></div>
            </div>

        </div>


        <p class="click-text">
            🎁 Click the Gift Box 🎁
        </p>

    </div>


    <script src="script.js"></script>

</body>
</html>
